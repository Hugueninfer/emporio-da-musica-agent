[project]
name = "emporio"
version = "0.1.0"
description = "Clave: agente de atendimento da Empório da Música (LangGraph + Claude)"
authors = [
    { name = "Pedro Huguenin", email = "hugueninpedro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
